name: Kotlin and Rust ledger contract

on:
  pull_request:
    paths:
      - 'android/**'
      - 'rust-core/**'
      - 'tests/contracts/**'
      - '.github/workflows/ledger-contract.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'rust-core/**'
      - 'tests/contracts/**'
      - '.github/workflows/ledger-contract.yml'

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify Rust ledger contract
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component clippy,rustfmt
          cargo +1.85.1 fmt --manifest-path rust-core/Cargo.toml -- --check
          cargo +1.85.1 clippy --manifest-path rust-core/Cargo.toml --locked --all-targets -- -D warnings
          cargo +1.85.1 test --manifest-path rust-core/Cargo.toml --locked --all-targets
  jni-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify JNI correction ABI on JVM
        run: |
          rustup toolchain install 1.85.1 --profile minimal --component clippy,rustfmt
          cargo +1.85.1 fmt --manifest-path rust-core/jni/Cargo.toml -- --check
          cargo +1.85.1 clippy --manifest-path rust-core/jni/Cargo.toml --locked --all-targets -- -D warnings
          cargo +1.85.1 test --manifest-path rust-core/jni/Cargo.toml --locked
          cargo +1.85.1 build --manifest-path rust-core/jni/Cargo.toml --locked --release
          javac --release 17 -d "$RUNNER_TEMP/jni-classes" android/app/src/main/java/dev/ventry/raschet/bridge/NativeCorrection.java tests/contracts/NativeCorrectionSmoke.java
          java -cp "$RUNNER_TEMP/jni-classes" NativeCorrectionSmoke rust-core/jni/target/release/libraschet_jni.so tests/contracts/correction.tsv
  kotlin:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          # PR caches are scoped to that PR; permit warm re-runs without changing release jobs.
          cache-read-only: ${{ github.event_name != 'pull_request' && github.ref != 'refs/heads/main' }}
      - name: Install SDK
        run: |
          sdkmanager_bin="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager_bin" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify Kotlin arithmetic and Java interoperability
        run: gradle -p android :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon
