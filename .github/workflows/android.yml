name: Android APK

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      - 'tests/android-bundle.test.js'
      - 'tests/android-onboarding.test.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: |
          sdkmanager_bin="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_bin"
          "$sdkmanager_bin" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Проверить точность расчётов и нативный Android
        run: |
          node --test tests/ledger.test.js tests/android-bundle.test.js tests/android-onboarding.test.js
      - name: Lint and assemble native APK
        run: |
          if ! gradle -p android lintDebug assembleDebug --no-daemon; then
            cat android/app/build/reports/lint-results-debug.txt 2>/dev/null || true
            exit 1
          fi
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          if unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -Eq 'assets/(index.html|app.js|ledger.js|style.css)'; then
            echo 'Unexpected web UI assets in native APK'; exit 1
          fi
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Raschet-native-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
