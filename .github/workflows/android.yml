name: Android APK

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: |
          sdkmanager_bin="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_bin"
          "$sdkmanager_bin" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Проверить точность расчётов и Android-экспорт
        run: |
          node --test tests/ledger.test.js tests/android-bundle.test.js
      - name: Lint and assemble
        env:
          RASCHET_ORIGIN: ${{ vars.RASCHET_ORIGIN }}
        run: |
          gradle -p android lintDebug assembleDebug --no-daemon "-PraschetOrigin=${RASCHET_ORIGIN:-https://raschet.135-106-227-179.sslip.io}"
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          for name in index.html style.css app.js ledger.js; do
            unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -Fq "assets/$name"
          done
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Raschet-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
