name: Android Rust JNI preview

on:
  pull_request:
    paths:
      - 'android/**'
      - 'rust-core/**'
      - 'scripts/build-rust-android.sh'
      - 'scripts/verify-rust-preview-apk.py'
      - 'tests/contracts/correction.tsv'
      - '.github/workflows/rust-android-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-jni:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install SDK and pinned NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          rustup toolchain install 1.85.1 --profile minimal
      - name: Build four Android Rust ABIs
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" bash scripts/build-rust-android.sh
      - name: Assemble and verify preview APK
        run: |
          gradle -p android -PraschetRustPreview=true :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          python3 scripts/verify-rust-preview-apk.py "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 "$apk"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader
          script: gradle -p android -PraschetRustPreview=true -Pandroid.testInstrumentationRunnerArguments.class=dev.ventry.raschet.bridge.NativeCorrectionInstrumentedTest :app:connectedDebugAndroidTest --no-daemon
      - name: Upload JNI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Raschet-rust-preview-tests
          path: android/app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14
