name: Raschet public licensed candidate
on:
  pull_request:
    paths:
      - 'android/**'
      - 'rust-core/**'
      - 'scripts/build-rust-android.sh'
      - 'scripts/verify-rust-preview-apk.py'
      - '.github/workflows/raschet-public-licensed-candidate.yml'
  workflow_dispatch:
    inputs:
      public_key:
        description: 'Existing Delivery raw Ed25519 PUBLIC key, not private seed'
        required: true
        type: string
permissions:
  contents: read
jobs:
  candidate:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install SDK and Rust
        run: |
          set -euo pipefail
          sdkmanager_bin="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager_bin" --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          rustup toolchain install 1.85.1 --profile minimal
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" bash scripts/build-rust-android.sh
      - name: Resolve public pin (synthetic on PR)
        env:
          OWNER_PIN: ${{ inputs.public_key }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" = pull_request ]]; then
            # RFC 8032 public test vector; never sign/publish this PR artifact.
            pin=d75a980182b10ab7d54bfed3c964073a0ee172f3daa62325af021a68f707511a
          else pin="$OWNER_PIN"; fi
          [[ "$pin" =~ ^[0-9a-f]{64}$ && "$pin" != "$(printf '%064d' 0)" ]]
          printf 'RASCHET_PUBLIC_PIN=%s\n' "$pin" >> "$GITHUB_ENV"
      - name: Reject invalid or mixed build profiles
        run: |
          set -euo pipefail
          if gradle -p android -PraschetPublicLicenseKey=invalid help --no-daemon; then exit 1; fi
          if gradle -p android -PraschetPublicLicenseKey="$RASCHET_PUBLIC_PIN" -PraschetLicensePublicKey="$RASCHET_PUBLIC_PIN" -PraschetLicenseOrigin=http://127.0.0.1:18444 help --no-daemon; then exit 1; fi
      - name: Verify ordinary ledger and public variant
        run: |
          set -euo pipefail
          python3 scripts/test-release-request.py
          gradle -p android -PraschetPublicLicenseKey="$RASCHET_PUBLIC_PIN" testDebugUnitTest lintRelease assembleRelease --no-daemon
          apk=android/app/build/outputs/apk/release/app-release-unsigned.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          python3 scripts/verify-rust-preview-apk.py "$apk"
          "$tools/zipalign" -c -P 16 4 "$apk"
          "$tools/aapt" dump badging "$apk" | grep -F "package: name='dev.ventry.raschet' versionCode='36' versionName='0.31.0-beta.1'"
          "$tools/aapt" dump permissions "$apk" | grep -F android.permission.INTERNET
          "$tools/aapt" dump xmltree "$apk" AndroidManifest.xml | grep -F '.license.LicenseActivity'
          python3 - <<'PY'
          from pathlib import Path
          import os
          roots=list(Path("android/app/build/generated").rglob("BuildConfig.java"))
          assert any('LICENSE_REQUIRED = true' in p.read_text() and 'LICENSE_PUBLIC_PROFILE = true' in p.read_text() and 'https://license.ventrylab.top' in p.read_text() and os.environ["RASCHET_PUBLIC_PIN"] in p.read_text() for p in roots)
          PY
      - name: Prepare existing release signing material (main dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          STORE: ${{ secrets.RASCHET_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$STORE"
          printf '%s' "$STORE" | base64 --decode > "$RUNNER_TEMP/raschet-signing.jks"
      - name: Build signed owner acceptance candidate (never publish)
        if: github.event_name == 'workflow_dispatch'
        env:
          RASCHET_SIGNING_STORE_FILE: ${{ runner.temp }}/raschet-signing.jks
          RASCHET_SIGNING_STORE_PASSWORD: ${{ secrets.RASCHET_SIGNING_STORE_PASSWORD }}
          RASCHET_SIGNING_KEY_ALIAS: ${{ secrets.RASCHET_SIGNING_KEY_ALIAS }}
          RASCHET_SIGNING_KEY_PASSWORD: ${{ secrets.RASCHET_SIGNING_KEY_PASSWORD }}
          EXPECTED_CERT: ${{ vars.RASCHET_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in RASCHET_SIGNING_STORE_PASSWORD RASCHET_SIGNING_KEY_ALIAS RASCHET_SIGNING_KEY_PASSWORD; do test -n "${!name:-}"; done
          [[ "$EXPECTED_CERT" =~ ^[0-9a-fA-F]{64}$ ]]
          gradle -p android -PraschetPublicLicenseKey="$RASCHET_PUBLIC_PIN" assembleRelease --no-daemon
          apk=android/app/build/outputs/apk/release/app-release.apk
          tools="$ANDROID_HOME/build-tools/35.0.0"
          python3 scripts/verify-rust-preview-apk.py "$apk"
          "$tools/zipalign" -c -P 16 4 "$apk"
          "$tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/cert.txt"
          actual="$(awk -F': ' '/^Signer #1 certificate SHA-256 digest: /{print tolower($2)}' "$RUNNER_TEMP/cert.txt")"
          [[ "$actual" == "${EXPECTED_CERT,,}" ]]
          "$tools/aapt" dump badging "$apk" | grep -F "package: name='dev.ventry.raschet' versionCode='36' versionName='0.31.0-beta.1'"
          out="$RUNNER_TEMP/licensed-candidate"
          mkdir -p "$out"
          cp "$apk" "$out/Raschet-licensed-candidate.apk"
          printf '%s\n' "$actual" > "$out/CERT_SHA256"
          printf '%s\n' "$GITHUB_SHA" > "$out/REVISION"
          printf '%s\n' "$RASCHET_PUBLIC_PIN" > "$out/LICENSE_PUBLIC_KEY"
          (cd "$out" && sha256sum Raschet-licensed-candidate.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: Raschet-licensed-candidate
          path: ${{ runner.temp }}/licensed-candidate/
          retention-days: 7
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/raschet-signing.jks"
